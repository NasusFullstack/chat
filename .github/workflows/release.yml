name: Release (PC + 모바일)

on:
  push:
    tags:
      # 정식 배포. 베타 태그(v2.2.0-beta.1 등)는 여기서 걸리면 안 된다 - 그러면 테스트
      # 버전이 정식 릴리즈로 나가서 모든 사용자에게 자동 업데이트로 내려간다
      - 'v*'
      - '!v*-beta*'

permissions:
  contents: write

jobs:
  # 안드로이드 APK. PC exe와 **같은 태그**에서 나와야 둘이 같은 버전이 된다.
  # 리눅스에서 만든다 - 윈도우 러너보다 빠르고, APK는 어디서 만들든 같다
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # **서명 키는 저장소에 없다.** 비밀값으로 받아 빌드할 때만 꺼내 쓴다.
      # 이 키로 서명해야만 앞선 버전 위에 덮어쓰기로 깔린다 - 키가 바뀌면 사람이
      # 앱을 지웠다 다시 깔아야 하고 그때 설정이 날아간다
      - name: 서명 키 꺼내기
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/chupchat.jks"
          cat > mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/chupchat.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # 버전이 어긋난 채로 나가면 앱이 "새 버전 있다"를 영영 띄우거나 영영 안 띄운다
      - name: PC와 버전이 같은지 확인
        run: python tests/test_version_sync.py

      - name: 검사
        working-directory: mobile
        run: flutter test

      # **CPU 종류별로 따로 만든다.** 한 덩어리로 만들면 쓰지도 않는 32비트·x86 코드가
      # 같이 들어가서 49.7MB가 된다(실측). arm64만 담으면 17.3MB다 - 스토어 밖에서는
      # 패치할 때마다 통째로 받아야 하므로 이 차이가 매번 그대로 온다.
      #
      # arm64 하나만 올린다. 2016년 이후 안드로이드 폰은 전부 arm64다
      - name: APK 만들기
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: 서명 확인
        run: |
          APK=mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner
          "$SIGNER" verify --print-certs "$APK" | grep -q 'CN=ChupChat' \
            || { echo '우리 키로 서명되지 않았다 - 이대로 내보내면 업데이트가 안 깔린다'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  release:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # --onedir: --onefile은 실행할 때마다 임시폴더에 압축을 새로 푸는데, 그 타이밍에
      # 백신이 끼어들면 "Failed to load Python DLL" 오류가 나는 경우가 있어서(자동 업데이트
      # 직후뿐 아니라 평소 실행에서도 재현됨), 미리 풀린 상태로 배포하는 --onedir로 바꿈
      #
      # 치트 연출용 이미지(battlecruiser/mineral/gas)는 저장소에 있으면 같이 넣고, 없으면
      # 그냥 건너뜀 - 앱이 파일 없을 때는 직접 그리는 쪽으로 폴백하므로 빌드가 깨지지 않음
      # **spec 파일로 빌드한다.** 예전에는 여기에 옵션을 늘어놓았는데, 그러면 spec과
      # 워크플로가 두 벌이 되어 한쪽만 고치면 CI 빌드에서만 달라진다(1번 규칙의
      # 순환참조 사고가 정확히 그 차이에서 났다). 같이 넣을 파일, 시작 그림, 빼는
      # Qt 모듈은 전부 FriendChat_GUI.spec 한 곳에 있다
      - name: Build GUI
        shell: pwsh
        run: pyinstaller --noconfirm --clean FriendChat_GUI.spec

      # 앱 내부 자동 업데이트가 받는 패키지 - 설치 폴더 내용물을 통째로 교체하는 용도
      - name: Package update archive
        shell: pwsh
        run: Compress-Archive -Path "dist/FriendChat_GUI/*" -DestinationPath "dist/FriendChat_GUI.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      # 모바일 쪽에서 만든 APK를 가져와 같은 릴리즈에 올린다
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      # 사람이 폰에서 받을 파일이므로 이름을 알아볼 수 있게 바꾼다.
      # **앱 안의 업데이트 확인이 이 이름을 보고 찾는다** - 바꾸면 거기도 같이 고칠 것
      - name: APK 이름 붙이기
        shell: pwsh
        run: Move-Item apk/app-arm64-v8a-release.apk "apk/ChupChat.apk"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "installer_output/FriendChat_Setup.exe" "dist/FriendChat_GUI.zip" "apk/ChupChat.apk" --title "${{ github.ref_name }}" --generate-notes
