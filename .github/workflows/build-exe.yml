name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_CLI cli_client.py
      # 치트 연출용 이미지는 저장소에 있으면 같이 넣고 없으면 건너뜀(release.yml과 같은 규칙)
      - name: Build GUI
        shell: pwsh
        run: |
          # spec 하나로 빌드한다 - 옵션을 여기 늘어놓으면 spec과 두 벌이 되어
          # 한쪽만 고쳤을 때 CI 빌드에서만 달라진다
          pyinstaller --noconfirm FriendChat_GUI.spec
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_Server server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Windows
          path: |
            dist/FriendChat_CLI.exe
            dist/FriendChat_GUI/
            dist/FriendChat_Server.exe

  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name FriendChat_Server_Linux server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Server-Linux
          path: dist/FriendChat_Server_Linux
