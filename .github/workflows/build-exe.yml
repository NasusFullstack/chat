name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat tui_client.py
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_CLI cli_client.py
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_Server server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Windows
          path: |
            dist/FriendChat.exe
            dist/FriendChat_CLI.exe
            dist/FriendChat_Server.exe

  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name FriendChat_Server_Linux server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Server-Linux
          path: dist/FriendChat_Server_Linux
