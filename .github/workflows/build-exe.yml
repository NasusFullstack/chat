name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    # 모바일 앱과 문서만 고쳤을 때는 윈도우 exe를 다시 만들 이유가 없다.
    # 안 걸러두면 모바일 작업을 할 때마다 PC 빌드가 헛돈다
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # PySide6 휠 하나가 170MB 다. 캐시가 없으면 릴리즈마다 그 시간을 그대로
          # 다시 낸다(실측: 내려받기만 몇 분). requirements.txt 가 바뀌면 알아서 새로 받는다
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_CLI cli_client.py
      # 치트 연출용 이미지는 저장소에 있으면 같이 넣고 없으면 건너뜀(release.yml과 같은 규칙)
      - name: Build GUI
        shell: pwsh
        run: |
          # spec 하나로 빌드한다 - 옵션을 여기 늘어놓으면 spec과 두 벌이 되어
          # 한쪽만 고쳤을 때 CI 빌드에서만 달라진다
          pyinstaller --noconfirm FriendChat_GUI.spec
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_Server server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Windows
          path: |
            dist/FriendChat_CLI.exe
            dist/FriendChat_GUI/
            dist/FriendChat_Server.exe

  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # PySide6 휠 하나가 170MB 다. 캐시가 없으면 릴리즈마다 그 시간을 그대로
          # 다시 낸다(실측: 내려받기만 몇 분). requirements.txt 가 바뀌면 알아서 새로 받는다
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name FriendChat_Server_Linux server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Server-Linux
          path: dist/FriendChat_Server_Linux
