name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build client (FriendChat.exe)
        run: |
          pyinstaller --noconfirm --onefile --console --name FriendChat tui_client.py

      - name: Build server (FriendChat_Server.exe)
        run: |
          pyinstaller --noconfirm --onefile --console --name FriendChat_Server server.py

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Windows-EXE
          path: |
            dist/FriendChat.exe
            dist/FriendChat_Server.exe
