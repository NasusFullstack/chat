name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_CLI cli_client.py
      # 치트 연출용 이미지는 저장소에 있으면 같이 넣고 없으면 건너뜀(release.yml과 같은 규칙)
      - name: Build GUI
        shell: pwsh
        run: |
          $data = @("icon.ico", "icon.png")
          foreach ($name in @("battlecruiser.png", "mineral.png", "gas.png")) {
            if (Test-Path $name) { $data += $name }
          }
          # $args는 PowerShell 자동 변수라 덮어쓰면 안 됨 - 다른 이름을 씀
          $dataArgs = @()
          foreach ($name in $data) { $dataArgs += @("--add-data", "$name;.") }
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico @dataArgs --name FriendChat_GUI gui_client.py
      - run: pyinstaller --noconfirm --onefile --console --name FriendChat_Server server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Windows
          path: |
            dist/FriendChat_CLI.exe
            dist/FriendChat_GUI/
            dist/FriendChat_Server.exe

  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name FriendChat_Server_Linux server.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-Server-Linux
          path: dist/FriendChat_Server_Linux
